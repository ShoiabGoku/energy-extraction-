<svg xmlns="http://www.w3.org/2000/svg" width="680" height="640" viewBox="0 0 680 640" role="img" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
<title>Passive electric eel habitat harvester</title>
<desc>An electric eel discharges naturally in its habitat tank; guarded inert electrodes pick up a small share of each pulse; a pulse catcher rectifies and clamps it; a small supercapacitor bank stores it; the energy powers an eel health monitor, a keeper shock alarm and an education display.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="640" fill="#FFFFFF"/>
<g font-size="14" text-anchor="middle" dominant-baseline="central">
<rect x="110" y="20" width="460" height="196" rx="8" fill="none" stroke="#B4B2A9" stroke-dasharray="4 4"/>
<text x="126" y="42" text-anchor="start" font-size="12" fill="#5F5E5A">Habitat tank</text>
<rect x="220" y="40" width="240" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/>
<text x="340" y="59" font-weight="600" fill="#712B13">Electric eel</text>
<text x="340" y="78" font-size="12" fill="#993C1D">Hunts and defends as usual</text>
<line x1="340" y1="98" x2="340" y2="130" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a)"/>
<rect x="220" y="136" width="240" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="340" y="155" font-weight="600" fill="#2C2C2A">Guarded electrode array</text>
<text x="340" y="174" font-size="12" fill="#5F5E5A">6 graphite plates behind screens</text>
<rect x="110" y="240" width="460" height="196" rx="8" fill="none" stroke="#B4B2A9" stroke-dasharray="4 4"/>
<text x="126" y="262" text-anchor="start" font-size="12" fill="#5F5E5A">Harvester</text>
<line x1="340" y1="194" x2="340" y2="254" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a)"/>
<rect x="220" y="260" width="240" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="340" y="279" font-weight="600" fill="#2C2C2A">Pulse catcher</text>
<text x="340" y="298" font-size="12" fill="#5F5E5A">Polyphase bridge, clamp, 47 µF</text>
<line x1="340" y1="318" x2="340" y2="350" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a)"/>
<rect x="220" y="356" width="240" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="340" y="375" font-weight="600" fill="#2C2C2A">Supercapacitor bank</text>
<text x="340" y="394" font-size="12" fill="#5F5E5A">1 F, ≤ 5 V (12.5 J), 3.3 V out</text>
<path d="M340 414 L340 468 L130 468 L130 490" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a)"/>
<path d="M340 414 L340 490" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a)"/>
<path d="M340 414 L340 468 L550 468 L550 490" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a)"/>
<rect x="40" y="496" width="180" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text x="130" y="515" font-weight="600" fill="#085041">Eel health monitor</text>
<text x="130" y="534" font-size="12" fill="#0F6E56">Water + activity log</text>
<rect x="250" y="496" width="180" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text x="340" y="515" font-weight="600" fill="#085041">Keeper shock alarm</text>
<text x="340" y="534" font-size="12" fill="#0F6E56">Lights on live water</text>
<rect x="460" y="496" width="180" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text x="550" y="515" font-weight="600" fill="#085041">Education display</text>
<text x="550" y="534" font-size="12" fill="#0F6E56">Energy made today</text>
<rect x="150" y="582" width="12" height="12" rx="2" fill="#FAECE7" stroke="#993C1D"/>
<text x="168" y="588" text-anchor="start" font-size="12" fill="#444441">Living source</text>
<rect x="290" y="582" width="12" height="12" rx="2" fill="#F1EFE8" stroke="#5F5E5A"/>
<text x="308" y="588" text-anchor="start" font-size="12" fill="#444441">Machine</text>
<rect x="400" y="582" width="12" height="12" rx="2" fill="#E1F5EE" stroke="#0F6E56"/>
<text x="418" y="588" text-anchor="start" font-size="12" fill="#444441">Right-purpose uses</text>
</g>
</svg>
